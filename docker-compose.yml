services:
  postgres:
    image: postgres:17
    container_name: booking-agent-postgres
    environment:
      POSTGRES_DB: booking_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - booking_agent_data:/var/lib/postgresql/data

volumes:
  booking_agent_data: